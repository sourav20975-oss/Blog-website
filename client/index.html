<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0b0d" />

    <!-- Icons & Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.svg" />

    <!-- Page Title & Meta -->
    <title>BlogVerse — Engineering Notes & Handbooks</title>
    <meta
      name="description"
      content="Practical engineering notes and reference handbooks on Linux systems, database architecture, backend engineering, and web development."
    />
    <meta name="author" content="Sourav Kumar" />

    <!-- Open Graph / Facebook / LinkedIn / WhatsApp Sharing Image -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="BlogVerse" />
    <meta property="og:title" content="BlogVerse — Engineering Notes & Handbooks" />
    <meta
      property="og:description"
      content="Practical engineering notes and reference handbooks on Linux systems, database architecture, backend engineering, and web development."
    />
    <meta property="og:image" content="/og-image.svg" />
    <meta property="og:image:type" content="image/svg+xml" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="BlogVerse Engineering Notes and Reference Handbooks" />

    <!-- Twitter / X Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="BlogVerse — Engineering Notes & Handbooks" />
    <meta
      name="twitter:description"
      content="Practical engineering notes and reference handbooks on Linux systems, database architecture, backend engineering, and web development."
    />
    <meta name="twitter:image" content="/og-image.svg" />
    <meta name="twitter:image:alt" content="BlogVerse Engineering Notes and Reference Handbooks" />

    <!-- Google Fonts: Plus Jakarta Sans (Editorial UI) & JetBrains Mono (Code) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,600&display=swap"
      rel="stylesheet"
    />

    <script>
      (function () {
        var t = null;
        try {
          t = localStorage.getItem('theme');
        } catch (e) {}
        if (t !== 'light' && t !== 'dark') {
          t =
            window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
        }
        if (t === 'dark') document.documentElement.classList.add('dark');
      })();
    </script>
  </head>
  <body class="font-sans antialiased selection:bg-orange-500/20 selection:text-orange-600 dark:selection:text-orange-300">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
